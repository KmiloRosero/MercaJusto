# Postgres local para desarrollo (en producción se usa Neon).
# Uso: docker compose up -d
# DATABASE_URL="postgresql://mercajusto:mercajusto@localhost:5432/mercajusto?schema=public"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercajusto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercajusto
      POSTGRES_PASSWORD: mercajusto
      POSTGRES_DB: mercajusto
    ports:
      - "5432:5432"
    volumes:
      - mercajusto_data:/var/lib/postgresql/data

volumes:
  mercajusto_data:

# Opcional: Postgres + PostGIS para cuando migres de SQLite.
# Uso: docker compose up -d
# Luego cambia DATABASE_URL en .env a la que está comentada abajo.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mercajusto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercajusto
      POSTGRES_PASSWORD: mercajusto
      POSTGRES_DB: mercajusto
    ports:
      - "5432:5432"
    volumes:
      - mercajusto_data:/var/lib/postgresql/data

volumes:
  mercajusto_data:
